services:
  mcp-server:
    build:
      # Set the build context to the subdirectory containing the Dockerfile and code
      context: .
      dockerfile: Dockerfile
    container_name: fabric-api-mcp
    image: fabric-api-mcp:latest
    restart: always
    # The MCP server uses port 5000 internally (as defined in __main__.py)
    networks:
      - frontend
    # NOTE: We don't need 'ports:' here unless you want to access it directly from the host.
    # We rely on 'nginx' to route traffic to it.
    environment:
      FABRIC_ORCHESTRATOR_HOST: orchestrator.fabric-testbed.net
      FABRIC_AM_HOST: artifacts.fabric-testbed.net
      FABRIC_CORE_API_HOST: uis.fabric-testbed.net
      FABRIC_CREDMGR_HOST: cm.fabric-testbed.net
      # Only nginx may assert the real client address via X-Real-IP. Keep this
      # in step with the nginx service's ipv4_address below. Without it the
      # socket peer is always nginx, so every caller would share one rate-limit
      # bucket; with anything wider, any host in that range could forge the
      # header and mint buckets at will.
      RATE_LIMIT_TRUSTED_PROXIES: 172.31.240.10/32
    volumes:
      - ./mcp-logs:/var/log/mcp # Optional: for application logs

  nginx:
    image: openresty/openresty:latest
    container_name: fabric-api-nginx
    networks:
      frontend:
        # Fixed so mcp-server can trust exactly this address, and nothing else,
        # for the X-Real-IP it uses as the rate-limit key. Keep in step with
        # RATE_LIMIT_TRUSTED_PROXIES on mcp-server.
        ipv4_address: 172.31.240.10
      backend:
    ports:
      - 443:443
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      - ./ssl/fullchain.pem:/etc/ssl/public.pem
      - ./ssl/privkey.pem:/etc/ssl/private.pem
      - ./nginx-logs:/var/log/nginx
    restart: always

  vouch-proxy:
    image: fabrictestbed/vouch-proxy:0.27.1
    container_name: fabric-api-vouch
    restart: always
    networks:
      - frontend
    volumes:
      - ./vouch:/config

  prometheus:
    image: prom/prometheus:latest
    container_name: fabric-api-prometheus
    restart: always
    user: "${PROMETHEUS_UID:-65534}:${PROMETHEUS_GID:-65534}"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - frontend
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/data/production/services/api-mcp/monitoring/prometheus:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: fabric-api-grafana
    restart: always
    user: "${GRAFANA_UID:-472}:${GRAFANA_GID:-472}"
    networks:
      - frontend
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: "https://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /opt/data/production/services/api-mcp/monitoring/grafana:/var/lib/grafana

networks:
  frontend:
    # Pinned so the nginx container can be given a fixed address, which
    # mcp-server trusts (and only that address) for the X-Real-IP header it uses
    # as the rate-limit key. Change both this subnet and NGINX_FRONTEND_IP
    # together if it collides with an existing network on the host.
    ipam:
      config:
        - subnet: 172.31.240.0/24
  backend:
    internal: true

volumes: {}
